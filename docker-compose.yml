services:
  api:
    build: ./backend
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    working_dir: /workspace
    volumes: ["./:/workspace"]
    ports: ["8000:8000"]
  dashboard:
    image: node:22-alpine
    working_dir: /workspace/frontend
    volumes: ["./:/workspace"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
